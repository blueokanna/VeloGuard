[workspace]
resolver = "3"
members = [
    "veloguard-core",
    "veloguard-dns",
    "veloguard-lib",
    "veloguard-netstack",
    "veloguard-protocol",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "1.0.1"
authors = ["blueokanna"]
description = "Cross-platform proxy client core for VeloGuard"

[workspace.dependencies]
aead = "0.6.1"
aes = "0.9.2"
aes-gcm = "0.11.0"
anyhow = "1.0.104"
arti-client = { version = "0.45.0", default-features = false, features = [
    "tokio",
    "rustls",
    "static-sqlite",
] }
async-recursion = "1"
async-trait = "0.1.91"
aws-lc-rs = { version = "1", default-features = false, features = [
    "prebuilt-nasm",
] }
axum = { version = "0.8.9", features = ["ws"] }
axum-macros = "0.5"

base64 = "0.23.1"
rustbinary = { version = "0.1.4", features = ["derive"] }
bitflags = "2.13.1"
blake2 = "0.10"
blake3 = "1.8.6"
bollard = "0.21.0"
byteorder = "1"
bytes = "1.12.1"

cfb-mode = "0.9.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
cidr = "0.3"
clap = { version = "4", features = ["derive"] }
const-fnv1a-hash = "1.1"
crc32fast = "1"
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
curve25519-dalek = "5.0.0"

dashmap = "6.2.1"
dhcproto = "0.15.0"
digest = "0.11.3"
dirs = "6"
downcast-rs = "2"

educe = "0.7.4"
env_logger = "0.11"
erased-serde = "0.4"

filetime = "0.2"
flutter_rust_bridge = "=2.12.0"
futures = "0.3"

getrandom = { version = "0.4.3", features = ["std"] }

h2 = "0.4.15"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4"
hickory-client = { version = "0.25.2", default-features = false }
hickory-proto = { version = "0.26.1", default-features = false }
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "tokio",
] }
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.4"
httpmock = "0.8"
hyper = { version = "1.11.0", features = [
    "http1",
    "http2",
    "client",
    "server",
] }
hyper-util = { version = "0.1.20", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
hyperlocal = { version = "0.9", features = ["client"] }

ip_network_table-deps-treebitmap = "0.5"
ipnet = "2.12.1"

lazy_static = "1"
libc = "0.2"
lru = "0.18.2"
lru_time_cache = "0.11"

maxminddb = "0.30.0"
md-5 = "0.11.0"
memory-stats = "1"
mockall = "0.15.0"
murmur3 = "0.5"

network-interface = "2"

once_cell = "1.21.4"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.32.1", features = [
    "semconv_experimental",
] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }

parking_lot = "0.12"
pin-project-lite = "0.2.17"
portable-atomic = { version = "1.14.0", features = ["serde"] }
proptest = "1.11"
prost = "0.14.4"
public-suffix = "0.1"

quinn = { version = "0.11.11", default-features = false, features = [
    "futures-io",
    "runtime-tokio",
    "rustls",
] }
quinn-proto = { version = "0.11.16", default-features = false }

rand = "0.10.2"
rand_chacha = "0.10.0"
regex = "1.13.1"
register-count = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "stream",
    "socks",
] }
ring = { version = "0.17", features = ["std"] }
ring-compat = { version = "0.8", features = ["aead"] }
russh = { version = "0.62.4", default-features = false, features = [
    "async-trait",
] }
rustc_version = "0.4.1"
rustls = { version = "0.23.43", default-features = false, features = [
    "std",
    "ring",
] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2"

security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
serial_test = "4.0.1"
sha1 = "0.11"
sha2 = "0.11"
shadowsocks = { version = "1", features = [
    "aead-cipher-2022",
    "stream-cipher",
] }
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6.5", features = ["all"] }
sysinfo = "0.39.6"

tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["macros", "local-offset"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
tokio-test = "0.4"
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["net", "codec", "io", "compat"] }
tor-rtcompat = { version = "0.45.0", default-features = false }
totp-rs = { version = "6.0.0", features = ["serde_support"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-chrome = "0.7"
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
tracing-oslog = "0.3"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "local-time",
] }
tracing-test = "0.2"
tun-rs = { version = "2.8.8", features = ["async", "async_framed"] }

url = "2.5.8"
uuid = { version = "1.24.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

veloguard-core = { path = "veloguard-core" }
veloguard-dns = { path = "veloguard-dns" }
veloguard-lib = { path = "veloguard-lib" }
veloguard-netstack = { path = "veloguard-netstack" }
veloguard-protocol = { path = "veloguard-protocol" }

webpki-roots = "1.0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
] }
wintun-bindings = { version = "0.7.39", features = ["async"] }

x25519-dalek = { version = "3", features = ["static_secrets"] }

zeroize = "1.9.0"
zip = "8.6.0"
zstd = "0.13"
